---

name: Mutation Tests

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [4.x]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation:
    name: Infection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sockets, msgpack
          coverage: xdebug
          # Infection aborts the initial test run on any stderr output, and the msgpack
          # tests trigger an expected "Extra bytes" warning that log_errors sends there.
          ini-values: memory_limit=-1, log_errors=Off

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      # The Infection phar is unusable with Testo: its bundled adapter calls the
      # unscoped \Infection\StreamWrapper\IncludeInterceptor. Infection requires
      # PHP 8.3+, so it is installed here instead of in require-dev.
      - name: Install Infection
        run: |
          composer config allow-plugins.infection/extension-installer true
          composer require --dev --no-interaction --no-progress -W infection/infection testo/bridge-infection

      - name: Build test server
        run: docker build --tag test-server:local -f ./tests/test-server/Dockerfile ./tests/test-server

      - name: Run test server
        run: docker run --name test-server --rm -d -p "7079:7079/tcp" test-server:local

      - name: Run Infection
        run: vendor/bin/infection --threads=max --logger-github --show-mutations=0 --min-msi=90 --min-covered-msi=90
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ github.event_name == 'push' && secrets.STRYKER_DASHBOARD_API_KEY || '' }}
